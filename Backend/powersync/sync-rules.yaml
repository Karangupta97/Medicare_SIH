# =============================================================================
# PowerSync Sync Rules — Medicare offline dashboard
# =============================================================================
# Scopes each authenticated user's MongoDB documents into their local SQLite DB.
# Identity: the client JWT `sub` = the user's Mongo _id, exposed as
# request.user_id(). Every bucket is scoped to it → no cross-user PHI locally.
#
# IMPORTANT SYNTAX NOTES (learned from the validator):
#  - PowerSync SQL LOWER-CASES unquoted identifiers. All camelCase Mongo fields
#    (userId, patientId, createdAt, s3Key, planType, ...) MUST be DOUBLE-QUOTED
#    or they won't match, e.g. "userId" not userId.
#  - Array-membership (members[*].userId) is NOT valid in a parameter query, so
#    the "member-of-a-vault" case is handled by a token parameter + a data query
#    that matches the embedded members array via the JSON operator instead.
#
# MULTI-DB: this instance's connector targets the Patient DB. `prescriptions`
# lives in the Doctor DB and is therefore intentionally NOT synced here (the
# client falls back to online for prescriptions). To add it, run a second
# PowerSync instance against the Doctor DB (see powersync/README.md).
#
# STORAGE: metadata only — no file blobs. CONFLICTS: LWW for reports/
# notifications; prescriptions/vault/emergency are read-only from the client.
# =============================================================================

bucket_definitions:
  # User's own profile row.
  user_self:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "umid", "name", "lastname", "planType", "bloodGroup",
               "photoURL", "role", "addressLine1", "addressLine2", "district",
               "state", "postalCode"
        FROM users
        WHERE _id = bucket.user_id

  # Reports — metadata only. Owner: "userId".
  user_reports:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "userId", "filename", "originalFilename", "description",
               "reportType", "s3Key", "fileSize", "contentType", "category",
               "tags", "isPrivate", "inEmergencyFolder", "createdAt", "updatedAt"
        FROM reports
        WHERE "userId" = bucket.user_id

  # Notifications — owner: "userId".
  user_notifications:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "userId", "title", "message", "type", "read", "link",
               "createdAt", "updatedAt"
        FROM notifications
        WHERE "userId" = bucket.user_id

  # Medical info (Emergency Folder view) — owner: "userId".
  user_medical_info:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "userId", "allergies", "emergencyContact",
               "emergencyContactPhone"
        FROM medicalinfos
        WHERE "userId" = bucket.user_id

  # Shared reports — owner: "patientId".
  user_shared_reports:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "patientId", "doctorName", "doctorId", "reportIds",
               "accessDuration", "expiresAt", "status", "createdAt", "updatedAt"
        FROM reportshares
        WHERE "patientId" = bucket.user_id

  # Family vault the user HEADS. Owner: "headMember".
  family_vault_head:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "headMember", "name", "members", "planType",
               "maxMembers", "createdAt", "updatedAt"
        FROM familyvaults
        WHERE "headMember" = bucket.user_id

  # Family vault the user is a MEMBER of (not head). Array-membership isn't
  # supported in a parameter query, so we match the embedded members array in
  # the DATA query using the JSON containment operator against the token's
  # user id. (PowerSync evaluates members.userId across the embedded array.)
  family_vault_member:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "headMember", "name", "members", "planType",
               "maxMembers", "createdAt", "updatedAt"
        FROM familyvaults
        WHERE "members"."userId" = bucket.user_id

  # Family vault invites addressed to OR sent by the user. `otp` is a secret and
  # is intentionally NOT selected.
  family_vault_invites:
    parameters: SELECT request.user_id() AS user_id
    data:
      - >
        SELECT _id AS id, "vaultId", "invitedBy", "inviteeUmid", "inviteeUserId",
               "relationship", "status", "createdAt", "updatedAt"
        FROM familyvaultinvites
        WHERE "inviteeUserId" = bucket.user_id OR "invitedBy" = bucket.user_id
